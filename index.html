    --text: #7a4550;
    --muted: #b58089;
    --line: #ffc0c0;

    --idle-ink: #d0a3aa;

  .card {
    position: fixed; inset: 54px 52px;
    overflow-y: auto; scrollbar-width: none;
    display: flex; flex-direction: column;
  }
  .card::-webkit-scrollbar { display: none; }
  .inner {
    width: 100%; max-width: 420px; margin: auto; 
    position: relative;
    background: #ffe0e0;
    border: 2px solid var(--line); border-radius: 18px;
    padding: min(18px, 3.5vh) 20px min(16px, 3vh);
  }
  .card { padding-top: 14px; }
  /* scalloped lace trim + bow on top of the pink card */
  .inner::before {
    content: ""; position: absolute; left: 14px; right: 14px; top: -9px; height: 9px;
    background: radial-gradient(circle at 6px 9px, var(--line) 5px, transparent 5.5px) 0 0 / 12px 9px repeat-x;
  }
  .bow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 34px; height: 22px; }
  .inner .btn:not(.primary) { background: #ffffff; border: 1.5px solid #e0a0a0; }
  .inner .btn:not(.primary):hover { background: #fff7f7; }
  .settings { background: #fff0f0; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .mode {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--mode-ink, var(--idle-ink));
  }
  .dot { color: var(--mode-color); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .running .dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .icons { display: flex; gap: 2px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--soft); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }

  .time {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(34px, min(15vw, 17vh), 72px);
    font-weight: 500; letter-spacing: -.02em;
    text-align: center; margin: min(10px, 2vh) 0 4px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .sub { text-align: center; font-size: 14px; color: var(--muted); min-height: 20px; }
  .sub b { color: var(--mode-ink, var(--text)); font-weight: 600; }

  .bar { height: 4px; background: var(--soft); border-radius: 4px; margin: min(16px, 3vh) 0 min(18px, 3.5vh); overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--mode-color, var(--idle)); border-radius: 4px; transition: width .3s linear; }

  .controls { display: flex; gap: 8px; }
  .btn {
    flex: 1; height: 40px; border-radius: 9px; cursor: pointer;
    font: 500 14px Inter, sans-serif;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: var(--soft); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: #ffc0c0; border: 1.5px solid #e0a0a0; color: var(--on-fill); font-weight: 600; }
  .btn.primary:hover { background: #ffb0b0; }

  .btn[hidden] { display: none; }

  .stats {
    display: flex; justify-content: space-between; gap: 8px;
    margin-top: min(16px, 3vh); padding-top: min(14px, 2.5vh); border-top: 1px dashed var(--line);
    font-size: 12px; color: var(--muted);
  }
  .stats span b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* settings */
  .settings {
    display: none; margin-top: 14px; padding: 14px; border-radius: 10px;
    background: var(--soft); font-size: 13px;
  }
  .settings.open { display: block; }
  .ratio { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ratio input {
    width: 58px; height: 32px; padding: 0 8px; text-align: center;
    border: 1px solid var(--line); border-radius: 7px;
    background: var(--card); color: var(--text); font: 500 14px Inter, sans-serif;
  }
  .ratio input:focus { outline: 2px solid var(--work); outline-offset: -1px; }
  .hint { color: var(--muted); margin-top: 8px; font-size: 12px; line-height: 1.45; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; cursor: pointer; transition: .2s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + span { background: var(--work); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .link-btn { border: 0; background: none; color: var(--muted); font: 12px Inter, sans-serif; cursor: pointer; padding: 0; text-decoration: underline; }
  .link-btn:hover { color: var(--text); }

  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translate(-50%, 8px);
    background: var(--text); color: var(--bg); font-size: 13px; padding: 7px 12px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: .25s; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="frame"></div>
<div class="card" id="card"><div class="inner">
  <svg class="bow" viewBox="0 0 34 22" aria-hidden="true">
    <path d="M17 11 C11 3, 3 2, 3 8 C3 14, 11 14, 17 11 Z" fill="#ffc0c0" stroke="#e0a0a0" stroke-width="1.2"/>
    <path d="M17 11 C23 3, 31 2, 31 8 C31 14, 23 14, 17 11 Z" fill="#ffc0c0" stroke="#e0a0a0" stroke-width="1.2"/>
    <path d="M15 12 L11 21 M19 12 L23 21" stroke="#e0a0a0" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="17" cy="11" r="3" fill="#ffb0b0" stroke="#e0a0a0" stroke-width="1.2"/>
  </svg>
  <div class="top">
    <div class="mode" id="mode"><span class="dot"></span><span id="modeLabel">Ready</span></div>
    <div class="icons">
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="time" id="time">00:00</div>
  <div class="sub" id="sub">Start working — break time builds as you go</div>
  <div class="bar"><div id="bar"></div></div>

  <div class="controls">
    <button class="btn primary" id="mainBtn">Start focus</button>
    <button class="btn" id="pauseBtn" hidden>Pause</button>
    <button class="btn" id="secondaryBtn" hidden>Take break</button>
  </div>

  <div class="settings" id="settings">
    <div class="ratio">
      Every <input type="number" id="workIn" min="1" max="600" step="1" value="25"> min of work
      earns <input type="number" id="breakIn" min="0.5" max="600" step="0.5" value="5"> min of break
    </div>
    <div class="hint" id="ratioHint"></div>
    <div class="row">
      <span>Save unused break for next time</span>
      <label class="switch"><input type="checkbox" id="bankIn"><span></span></label>
    </div>
    <div class="row">
      <span>Sound when break ends</span>
      <label class="switch"><input type="checkbox" id="soundIn" checked><span></span></label>
    </div>
    <div class="row">
      <button class="link-btn" id="resetStats">Reset today's stats</button>
      <button class="link-btn" id="resetTimer">Reset timer</button>
    </div>
  </div>

  <div class="stats">
    <span>Focused today <b id="statFocus">0m</b></span>
    <span>Sessions <b id="statSessions">0</b></span>
    <span id="bankWrap">Saved break <b id="statBank">0m</b></span>
  </div>

  <div class="toast" id="toast"></div>
</div></div>

<script>
(() => {
  const KEY = 'flowmodoro-v1';
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  const today = () => new Date().toDateString();
  const defaults = {
    workMin: 25, breakMin: 5, bank: false, sound: true, theme: null,
    mode: 'idle',          // idle | work | break | done
    startedAt: null,       // ms timestamp when current running segment began
    accumulated: 0,        // ms already elapsed before current running segment (for pauses)
    paused: false,
    breakTotal: 0,         // ms of break allotted for current break
    banked: 0,             // ms of saved break
    day: today(), focusMs: 0, sessions: 0
  };
  let s = Object.assign({}, defaults);
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  if (s.day !== today()) { s.day = today(); s.focusMs = 0; s.sessions = 0; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} };

  // ---------- helpers ----------
  const ratio = () => s.breakMin / s.workMin;
  const elapsed = () => s.accumulated + (s.startedAt && !s.paused ? Date.now() - s.startedAt : 0);
  const fmt = ms => {
    const t = Math.max(0, Math.round(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
  };
  const fmtShort = ms => {
    const totalMin = Math.round(ms / 60000);
    if (totalMin < 60) return totalMin + 'm';
    return Math.floor(totalMin / 60) + 'h ' + (totalMin % 60) + 'm';
  };
  const earned = workMs => workMs * ratio();

  let toastT;
  const toast = msg => {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
  };

  // ---------- sound ----------
  let actx;
  const unlockAudio = () => {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
  };
  const chime = () => {
    if (!s.sound || !actx) return;
    try {
      [0, 0.22, 0.44].forEach((d, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = [660, 880, 990][i];
        g.gain.setValueAtTime(0, actx.currentTime + d);
        g.gain.linearRampToValueAtTime(0.25, actx.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d + 0.6);
        o.connect(g).connect(actx.destination);
        o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.65);
      });
    } catch (e) {}
  };

  // ---------- actions ----------
  function startWork() {
    s.mode = 'work'; s.accumulated = 0; s.startedAt = Date.now(); s.paused = false;
    save(); render();
  }
  function togglePause() {
    if (s.paused) { s.startedAt = Date.now(); s.paused = false; }
    else { s.accumulated = elapsed(); s.startedAt = null; s.paused = true; }
    save(); render();
  }
  function takeBreak() {
    const workMs = elapsed();
    s.focusMs += workMs; s.sessions += 1;
    s.breakTotal = earned(workMs) + (s.bank ? s.banked : 0);
    s.banked = 0;
    s.mode = 'break'; s.accumulated = 0; s.startedAt = Date.now(); s.paused = false;
    if (s.breakTotal < 1000) { endBreak(false); toast('Not enough work for a break yet'); return; }
    save(); render();
  }
  function endBreak(natural) {
    if (!natural && s.bank && s.mode === 'break') {
      s.banked += Math.max(0, s.breakTotal - elapsed());
    }
    s.mode = natural ? 'done' : 'idle';
    s.accumulated = 0; s.startedAt = null; s.paused = false; s.breakTotal = 0;
    save(); render();
    if (natural) { chime(); toast('Break over — ready when you are'); }
  }
  function resetTimer() {
    s.mode = 'idle'; s.accumulated = 0; s.startedAt = null; s.paused = false; s.breakTotal = 0;
    save(); render();
  }

  // ---------- render ----------
  const COLORS = { idle: 'idle', work: 'work', break: 'break', done: 'work' };
  function render() {
    const card = $('card');
    card.style.setProperty('--mode-color', `var(--${COLORS[s.mode]})`);
    card.style.setProperty('--mode-ink', `var(--${COLORS[s.mode]}-ink)`);
    $('mode').classList.toggle('running', (s.mode === 'work' || s.mode === 'break') && !s.paused);

    const main = $('mainBtn'), pause = $('pauseBtn'), sec = $('secondaryBtn');
    let time = '00:00', sub = '', pct = 0, label = 'Ready';

    if (s.mode === 'idle' || s.mode === 'done') {
      label = s.mode === 'done' ? 'Break over' : 'Ready';
      sub = s.mode === 'done' ? 'Nice reset. Start your next focus block.' : 'Start working — break time builds as you go';
      if (s.bank && s.banked > 999) sub = `You have <b>${fmt(s.banked)}</b> of saved break`;
      main.textContent = 'Start focus'; main.hidden = false;
      pause.hidden = true; sec.hidden = true;
    } else if (s.mode === 'work') {
      const e = elapsed();
      const br = earned(e) + (s.bank ? s.banked : 0);
      time = fmt(e);
      label = s.paused ? 'Focus · paused' : 'Focus';
      sub = `Break earned: <b>${fmt(br)}</b>`;
      // progress shows progress toward the next full "work block"
      pct = ((e / 60000) % s.workMin) / s.workMin * 100;
      main.textContent = 'Take break'; main.hidden = false;
      pause.textContent = s.paused ? 'Resume' : 'Pause'; pause.hidden = false;
      sec.hidden = true;
    } else if (s.mode === 'break') {
      const left = s.breakTotal - elapsed();
      if (left <= 0) { endBreak(true); return; }
      time = fmt(left);
      label = s.paused ? 'Break · paused' : 'Break';
      sub = `of <b>${fmt(s.breakTotal)}</b> earned`;
      pct = (1 - left / s.breakTotal) * 100;
      main.textContent = 'End break early'; main.hidden = false;
      pause.textContent = s.paused ? 'Resume' : 'Pause'; pause.hidden = false;
      sec.hidden = true;
    }

    $('modeLabel').textContent = label;
    $('time').textContent = time;
    $('sub').innerHTML = sub;
    $('bar').style.width = pct.toFixed(2) + '%';
    $('statFocus').textContent = fmtShort(s.focusMs + (s.mode === 'work' ? elapsed() : 0));
    $('statSessions').textContent = s.sessions;
    $('bankWrap').style.display = s.bank ? '' : 'none';
    $('statBank').textContent = fmtShort(s.banked);

    const tag = s.mode === 'work' ? '● ' : s.mode === 'break' ? '☕ ' : '';
    document.title = (s.mode === 'work' || s.mode === 'break') ? `${tag}${time} · Flowmodoro` : 'Flowmodoro Timer';
  }

  function renderSettings() {
    $('workIn').value = s.workMin; $('breakIn').value = s.breakMin;
    $('bankIn').checked = s.bank; $('soundIn').checked = s.sound;
    const perHour = Math.round(60 * ratio() * 10) / 10;
    $('ratioHint').textContent = `That's ${perHour} min of break per hour of work. Work for 50 min and you'll get ${Math.round(50 * ratio() * 10) / 10} min.`;
  }

  function applyTheme() {
    const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = 'light';
  }

  // ---------- wiring ----------
  $('mainBtn').addEventListener('click', () => {
    unlockAudio();
    if (s.mode === 'idle' || s.mode === 'done') startWork();
    else if (s.mode === 'work') takeBreak();
    else if (s.mode === 'break') endBreak(false);
  });
  $('pauseBtn').addEventListener('click', () => { unlockAudio(); togglePause(); });
  $('settingsBtn').addEventListener('click', () => $('settings').classList.toggle('open'));
  const onRatio = () => {
    const w = parseFloat($('workIn').value), b = parseFloat($('breakIn').value);
    if (w > 0) s.workMin = w;
    if (b > 0) s.breakMin = b;
    save(); renderSettings(); render();
  };
  $('workIn').addEventListener('input', onRatio);
  $('breakIn').addEventListener('input', onRatio);
  $('workIn').addEventListener('blur', renderSettings);
  $('breakIn').addEventListener('blur', renderSettings);
  $('bankIn').addEventListener('change', e => { s.bank = e.target.checked; if (!s.bank) s.banked = 0; save(); render(); });
  $('soundIn').addEventListener('change', e => { s.sound = e.target.checked; save(); });
  $('resetStats').addEventListener('click', () => { s.focusMs = 0; s.sessions = 0; s.banked = 0; save(); render(); toast('Stats reset'); });
  $('resetTimer').addEventListener('click', () => { resetTimer(); toast('Timer reset'); });
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); $('mainBtn').click(); }
  });

  applyTheme(); renderSettings(); render();
  setInterval(render, 250);
})();
</script>
</body>
</html>
